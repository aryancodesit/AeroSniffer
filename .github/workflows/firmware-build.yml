name: Firmware Build

on:
  push:
    branches: [main, releng-validation]
    paths:
      - 'AeroSniffer/**'
      - 'tools/**'
  pull_request:
    branches: [main]
    paths:
      - 'AeroSniffer/**'
      - 'tools/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Build firmware
        id: build
        run: |
          python3 tools/releng.py build > /tmp/releng_version.txt
          echo "VERSION=$(sed 's/^VERSION=//' /tmp/releng_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aerosniffer-${{ steps.build.outputs.VERSION }}
          path: build/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/*"
          bodyFile: "changelog.md"
          omitBodyDuringUpdate: true
          allowUpdates: true
