name: Firmware Build

on:
  push:
    branches: [main, releng-validation]
    paths:
      - 'AeroSniffer/**'
      - 'tools/**'
  pull_request:
    branches: [main]
    paths:
      - 'AeroSniffer/**'
      - 'tools/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Install dependencies
        run: python3 tools/releng.py install

      # ═════════════════════════════════════════════════════════
      #  DIAGNOSTICS — verify TFT_eSPI installation & config
      # ═════════════════════════════════════════════════════════

      - name: DIAG — arduino-cli config dump
        run: arduino-cli config dump

      - name: DIAG — arduino-cli lib list
        run: arduino-cli lib list

      - name: DIAG — TFT_eSPI installation
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== TFT_eSPI library contents (first 100 lines) ==="
          ls -R ~/Arduino/libraries/TFT_eSPI 2>/dev/null || echo "(no TFT_eSPI dir found)"
          echo "=== User_Setup.h ==="
          cat ~/Arduino/libraries/TFT_eSPI/User_Setup.h 2>/dev/null || echo "(no User_Setup.h found)"
          echo "=== User_Setup_Select.h ==="
          cat ~/Arduino/libraries/TFT_eSPI/User_Setup_Select.h 2>/dev/null || echo "(no User_Setup_Select.h found)"
          echo "=== TFT_eSPI.h processor include guard lines ==="
          sed -n '92,115p' ~/Arduino/libraries/TFT_eSPI/TFT_eSPI.h 2>/dev/null || echo "(no TFT_eSPI.h)"

      # ═════════════════════════════════════════════════════════
      #  COMPILE — clean build
      # ═════════════════════════════════════════════════════════

      - name: Build firmware
        id: build
        run: |
          # Remove stale build directory for a clean compile
          rm -rf build
          python3 tools/releng.py build --no-install > /tmp/releng_version.txt
          echo "VERSION=$(sed 's/^VERSION=//' /tmp/releng_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aerosniffer-${{ steps.build.outputs.VERSION }}
          path: build/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/*"
          bodyFile: "changelog.md"
          omitBodyDuringUpdate: true
          allowUpdates: true
