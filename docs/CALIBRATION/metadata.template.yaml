# V2.7.3 Calibration Campaign — Metadata Template
# Copy to metadata.yaml and fill before the first Phase 3 soak.
# This file is the schema reference; metadata.yaml is the live record.

schema_version: 1     # increment when adding/removing required fields

test_id:              # e.g. V2.7.3_B1_001

firmware_version:     # from FW_VERSION macro
git_commit:           # from GIT_HASH macro
branch:

board:                # from BOARD_NAME macro
framework:            # e.g. esp32-arduino 2.x.y
compiler:

fps:                  # measured sustained frame rate
calibration_build:    # true/false — was -DCALIBRATION active

tester:
datetime:             # YYYY-MM-DD HH:MM (local)

ambient_temperature:  # °C
power_source:         # USB / battery

test_type:            # engage_decay / mood_decay / touch_duration / memory_decay
soak_duration:        # minutes

notes:
